name: 아이마켓코리아 자동 모의투자
on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * 1-5' # 19:30 KST weekdays
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install 'pykrx>=1.0.48,<2' 'pandas==2.2.3' requests
      - name: Fetch KRX data
        run: python src/fetch.py
      - name: Rebuild deterministic paper-trade ledger
        run: python src/engine.py
      - name: Commit updated data and ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- docs/state.json
if [ -d data ]; then
  git add -A -- data/
fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update paper trading daily data'
            git push
          fi