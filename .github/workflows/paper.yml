
name: 아이마켓코리아 자동 모의투자

on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * 1-5'

permissions:
  contents: write

concurrency:
  group: imarket-paper-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch KRX data
        run: |
          python src/fetch.py

      - name: Rebuild paper trading ledger
        run: |
          python src/engine.py

      - name: Verify output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state_path = Path("docs/state.json")
          if not state_path.is_file():
              raise SystemExit("ERROR: state.json missing")

          state = json.loads(
              state_path.read_text(encoding="utf-8")
          )

          print("Data status:", state.get("data_status"))
          print("Last date:", state.get("last_date"))
          print("Trading days:", state.get("days"))

          if state.get("data_status") != "실측 데이터 로드":
              raise SystemExit(
                  "ERROR: No verified market data"
              )

          if not state.get("last_date"):
              raise SystemExit(
                  "ERROR: Missing market data date"
              )

          if not Path("data/daily.csv").is_file():
              raise SystemExit(
                  "ERROR: daily.csv missing"
              )

          print("Output verification passed")
          PY

      - name: Commit updated data and ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Update paper trading daily data"
            git push
          else
            echo "No changes to commit"
          fi
