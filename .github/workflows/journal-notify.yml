name: 아이마켓코리아 투자일지 및 이메일 알림

on:
  workflow_run:
    workflows: ["아이마켓코리아 자동 모의투자"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: imarket-journal-notify
  cancel-in-progress: false

jobs:
  journal:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate daily journal from verified state
        run: python src/journal.py
      - name: Save journal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/journal.json
          if ! git diff --cached --quiet; then
            git commit -m "Update paper trading decision journal"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Send email when credentials are configured
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: |
          if [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASSWORD" ] || [ -z "$REPORT_EMAIL_TO" ]; then
            echo "::notice::SMTP secrets not configured; journal generated, email skipped."
          else
            python src/email_report.py
          fi
