name: 아이마켓코리아 독립 규칙 검증

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated synthetic validation
        run: |
          python validate_paper_v1.py --engine src/engine.py --output validation-report.json
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imarket-validation-report
          path: validation-report.json
          if-no-files-found: warn
